# refueled: Linux regression in GitHub Actions. Replaces the WSL script docs/refueled/tools/linux-regress.sh.
# PREPARED ONLY: not run yet (there is no GitHub repo for the port). No secrets needed.
#
# Known, accepted deviations from the pre-port Linux behaviour (docs/refueled/ARCHITECTURE.md
# D21; none of them shows in normal operation, do not "fix" them in CI):
#   (1, 2 reverted by IF-11: low heap and the errno cell in the TCB block are Windows-only)
#   3 sysctl kern.arandom fills completely, EIO on failure    4 localtime_r/getrusage error paths
#   5 stale-temp cleanup also descends on DT_UNKNOWN          6 MAP_FIXED_NOREPLACE on kernels < 4.17
#   7 pool()/map_phys error paths                             8 CPU count / thread-name fallbacks
#   9 diagnostic texts (name truncation, own backtrace format) 10 scripts use UTF-8 regardless of locale
# D20 (SIGUSR2 thread dump replaced by sampling) was reverted by IF-10; SIGRTMIN+2 is not used.
name: linux-build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: Linux build, tests, platform tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # shell.nix has no nixpkgs pin (`import <nixpkgs>`), so the channel is pinned here via nix_path.
      # Note: nixos-unstable moves; if a run breaks without a code change, pin a nixpkgs commit instead.
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Optional cache for build outputs (GPU library takes ~40 CPU-minutes). Key on the vendored
      # sources and shell.nix; remove if it causes stale-build trouble.
      - uses: actions/cache@v4
        with:
          path: out/deps
          key: linux-out-deps-${{ hashFiles('shell.nix', 'build.sh', 'gpu/**') }}

      # build.sh re-enters nix-shell shell.nix by itself.
      - name: Build and C tests
        run: bash build.sh --test

      - name: Python tests
        run: nix-shell shell.nix --run "python3 -m unittest discover -s tests -p 'test_*.py' -v"

      - name: Platform tests
        run: nix-shell shell.nix --run "bash docs/refueled/tools/linux-platform-tests.sh"

      # Info only (never fails the job). linux_hits.py needs a shadPS4 checkout at the vendored
      # commit b4e7ae7 (--ref) to count only bbport's own changes in gpu/shadps4; without it that
      # directory is skipped. A shallow fetch of exactly that commit keeps this cheap.
      - name: Linux hits metric (info)
        continue-on-error: true
        run: |
          mkdir -p out/shadps4-ref
          git -C out/shadps4-ref init -q
          git -C out/shadps4-ref fetch -q --depth 1 https://github.com/shadps4-emu/shadPS4 b4e7ae776071ceb1dd35004577a8719481e1d258 || true
          git -C out/shadps4-ref checkout -q FETCH_HEAD || true
          if [ -d out/shadps4-ref/src ]; then
            python3 docs/refueled/tools/linux_hits.py --ref out/shadps4-ref
          else
            python3 docs/refueled/tools/linux_hits.py
          fi
